[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "am2-modern-rag-benchmark"
version = "0.2.0"
description = "Comparative lexical, dense, reranked and RAG retrieval benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "rank-bm25>=0.2.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]
data = [
  "ir-datasets>=0.5.9"
]
dense = [
  "sentence-transformers>=5.0,<6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
