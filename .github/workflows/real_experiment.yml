name: Run real RAG experiment

on:
  workflow_dispatch:
    inputs:
      run_full_models:
        description: Run cross-encoder reranking and Hugging Face generation
        required: true
        default: false
        type: boolean
      run_scifact:
        description: Run the larger public SciFact BM25-vs-dense benchmark
        required: true
        default: false
        type: boolean
      commit_evidence:
        description: Commit the generated evidence pack back to the selected branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core and dense dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dense]"

      - name: Run tests
        run: pytest -q

      - name: Run BM25 benchmark
        run: python scripts/run_bm25_demo.py

      - name: Run real dense retrieval comparison
        run: python scripts/run_dense_comparison.py

      - name: Run deterministic reranking/RAG pipeline
        run: python scripts/run_reranking_rag_demo.py

      - name: Install public benchmark dependencies
        if: ${{ inputs.run_scifact }}
        run: pip install -e ".[data]"

      - name: Run SciFact retrieval benchmark
        if: ${{ inputs.run_scifact }}
        run: python scripts/run_scifact_comparison.py

      - name: Install full reranker and generator dependencies
        if: ${{ inputs.run_full_models }}
        run: pip install -e ".[rerank,rag]"

      - name: Run real reranker and generator
        if: ${{ inputs.run_full_models }}
        run: python scripts/run_real_rag.py

      - name: Build assessor evidence pack
        run: python scripts/build_evidence_pack.py

      - name: Upload complete experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: am2-03-real-rag-results
          path: |
            results/
            evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Commit compact evidence pack
        if: ${{ inputs.commit_evidence }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evidence/
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "Add real RAG experiment evidence"
          git push origin HEAD:${{ github.ref_name }}
